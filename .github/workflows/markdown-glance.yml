name: MarkdownGlance

on:
  push:
    paths:
      - "MarkdownGlance/**"
      - ".github/workflows/markdown-glance.yml"
  pull_request:
    paths:
      - "MarkdownGlance/**"
      - ".github/workflows/markdown-glance.yml"

jobs:
  pure-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.8", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s MarkdownGlance/tests -p 'test_*.py'
      - run: python -m compileall -q MarkdownGlance
